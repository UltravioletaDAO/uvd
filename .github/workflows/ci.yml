name: ci

# Checks only: nothing here publishes or deploys.
on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "python/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "biome.json"
      - "LICENSE"
      - "AGENTS.md"
      - "README.md"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read # checkout only

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Checks, bundle, packages and criteria
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: false

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests, offline (anything not on 127.0.0.1 goes to a dead proxy)
        env:
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
          NODE_USE_ENV_PROXY: "1"
        run: npm test

      - name: Build the bundle
        run: npm run build

      - name: Tests against the bundle, offline
        env:
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
          NODE_USE_ENV_PROXY: "1"
        run: npm run test:dist

      - name: npm pack
        run: npm pack

      - name: Build the wheel
        run: npm run build:wheel

      - name: The tarball and the wheel carry THIRD_PARTY_LICENSES.txt with every bundled package
        run: npm run check:artifacts

      - name: Serve the recorded fixtures
        run: |
          node scripts/serve-fixtures.ts --port 47100 > "$RUNNER_TEMP/fixtures.url" &
          for _ in $(seq 1 50); do [ -s "$RUNNER_TEMP/fixtures.url" ] && break; sleep 0.1; done
          echo "UVD_EMPORIUM_URL=$(cat "$RUNNER_TEMP/fixtures.url")" >> "$GITHUB_ENV"
          echo "UVD_CACHE_DIR=$RUNNER_TEMP/uvd-cache" >> "$GITHUB_ENV"

      - name: "Criterion: npx the tarball, search wallet has results"
        run: |
          version=$(node -p "require('./package.json').version")
          # npm pack names the scoped @ultravioletadao/uvd tarball ultravioletadao-uvd-<version>.tgz.
          tgz="./ultravioletadao-uvd-$version.tgz"
          n=$(npx --yes "$tgz" search wallet --json | jq length)
          echo "uvd search wallet --json | jq length = $n"
          test "$n" -gt 0
          echo "uvd search reputacion --json (stdout | jq length, then stderr):"
          npx --yes "$tgz" search reputacion --json | jq length

      - name: "Criterion: uvx the wheel, --version"
        run: |
          version=$(node -p "require('./package.json').version")
          wheel="dist/uvd-$version-py3-none-any.whl"
          got=$(uvx --from "$wheel" uvd --version)
          echo "uvx --from $wheel uvd --version = $got"
          test "$got" = "$version"
          # The launcher passes stdin and the exit code through untouched.
          set +e
          echo '[1]' | uvx --from "$wheel" uvd call emporium_superficies --input -
          code=$?
          set -e
          test "$code" -eq 2
          n=$(echo '{}' | uvx --from "$wheel" uvd call emporium_superficies --input - | jq '.superficies | length')
          test "$n" -gt 0
